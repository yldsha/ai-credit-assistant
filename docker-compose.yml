services:
  mocks:
    build:
      context: ./mocks
    container_name: credit_mocks
    ports:
      - "8001:8001"
    environment:
      - MOCK_DATA_PATH=/app/data/seed.json
      - MOCK_LATENCY_MS=300
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: credit_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scoring:/app/scoring
    environment:
      - MOCKS_BASE_URL=http://mocks:8001
    depends_on:
      - mocks
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: credit_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

